# Isolated dev app. Run from repository root with --config deploy/dev/fly.toml.
app = "talerooms-dev"
primary_region = "sin"   # Singapore — closest to the target market

[build]
  dockerfile = "Dockerfile"
  # Web Push public key (non-secret) — inlined into the client bundle at build.
  # The matching VAPID_PRIVATE_KEY + VAPID_SUBJECT are runtime Fly secrets.
  [build.args]
    NEXT_PUBLIC_VAPID_PUBLIC_KEY = "BMozjArBIZPp7wTScfgBtXvWiD9wtfstTReI_Vnv03s3uYfNKGIPsdvqr8yWF0BFvKbedTZBmxFd0KrjPmOoidM"
    DEPLOYMENT_ENV = "dev"

[env]
  DEPLOYMENT_ENV = "dev"
  BETTER_AUTH_URL = "https://talerooms-dev.fly.dev"
  STRIPE_MODE = "test"
  STRIPE_CHECKOUT_ENABLED = "true"
  STRIPE_WALLET_ENABLED = "true"
  STRIPE_CONNECT_COUNTRIES = "SG"
  STRIPE_PAYOUT_CONTROLS_ENABLED = "false"

[http_service]
  internal_port = 3000
  force_https = true
  # Keep one machine always on (continuous, no cold starts). With a single
  # machine the uploads volume below stays consistent.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    method = "get"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"   # allow boot + first DB connection before checking

# Persist uploaded avatars and feed wallpapers across deploys/restarts.
[mounts]
  source = "talerooms_uploads"
  destination = "/app/public/uploads"

[[vm]]
  size = "shared-cpu-1x"
  # 1 GB headroom for the in-process embedding model used by the similarity
  # check. Bump to 2048 if publishes ever OOM.
  memory = "1024"
